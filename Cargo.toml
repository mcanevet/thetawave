# Ported real-world Leafwing fixture (thetawave, upstream commit
# 94fad04). This tree lives in the bevy-0.20 branch of the fork and
# is extracted WHOLESALE into fixtures/thetawave/ by
# scripts/fetch_bevy_examples.sh at a pinned commit SHA — the tree
# IS the fixture, so it is never regenerated or re-transformed by
# the fetch loop; changes belong on this branch, followed by a pin
# bump in the script.
[package]
name = "fixture_thetawave"
version = "0.1.0"
edition = "2021"
publish = false

[lints.rust]
# Upstream game code pokes these cfgs; expected, not an error.
unexpected_cfgs = { level = "allow" }

[features]
playtest = [
    "dep:bevy_playtest",
    "bevy_playtest/takeover",
    "bevy_playtest/takeover-winit",
    # Declared-tier discovery runs against this fixture: the whole
    # point is exercising the LW reader/tap/reconcile lens on a real
    # game's InputMaps.
    "bevy_playtest/lw-reader",
]
# Arcade serial-port hardware support was removed (hardware
# dongles; `bevy_serialport` has no Bevy-0.20-compatible release).
# Local sqlite persistence (thetawave_storage) is KEPT as an
# off-by-default `storage` feature — upstream parity; excluded from
# the playtest battery.
default = []
storage = ["thetawave_storage"]

[dependencies]
bevy = "0.20.1"
bevy_playtest = { path = "../..", optional = true }
leafwing-input-manager = "0.22"
bevy_rapier2d = "0.37"
bevy_kira_audio = { version = "0.27", features = ["mp3", "wav"] }
bevy_asset_loader = { version = "0.28", features = [
    "2d",
    "3d",
    "standard_dynamic_assets",
] }
serde = { version = "1.0.159", features = ["derive"] }
ron = "0.8.0"
strum = "0.25.0"
strum_macros = "0.25.1"
thiserror = "1.0"
derive_more = "0.99.17"
rand = "0.8.5"
image = { version = "0.25", default-features = false, features = ["png"] }
# Same winit as bevy_winit 0.20 uses; needed for the window icon.
winit = "0.30"
thetawave_interface = { path = "crates/thetawave_interface" }
thetawave_assets = { path = "crates/thetawave_assets" }
thetawave_storage = { path = "crates/thetawave_storage", optional = true }

[dev-dependencies]
# Self-dependency: activates OUR OWN `playtest` feature only for
# test/example/bench builds. Normal & release builds stay clean.
fixture_thetawave = { path = ".", features = ["playtest"] }
rstest = "0.18.2"
