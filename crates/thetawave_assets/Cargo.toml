[package]
name = "thetawave_assets"
version = "0.1.0"
edition = "2021"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[dependencies]
rand = "0.8.5"
bevy_kira_audio = { version = "0.27", features = ["mp3", "wav"] }
bevy_asset_loader = { version = "0.28", features = [
    "2d",
    "3d",
    "standard_dynamic_assets",
] }
thetawave_interface = { path = "../thetawave_interface" }
# required due to bevy_asset_loader expecting bevy to be imported
# port(0.14->0.20): TextureAtlasLayout moved to bevy_image, Font to
# bevy_text — covered by default features.
bevy = "0.20.1"
