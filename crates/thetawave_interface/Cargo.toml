[package]
name = "thetawave_interface"
version = "0.1.0"
edition = "2021"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[dependencies]
serde = { version = "1.0.159", features = ["derive"] }
strum = "0.25.0"
strum_macros = "0.25.1"
derive_more = "0.99.17"
bevy_ecs_macros = "0.20.1"
bevy_ecs = { version = "0.20.1", default-features = false }
bevy_reflect = "0.20.1"
leafwing-input-manager = "0.22"
bevy_input = { version = "0.20.1", default-features = false }
bevy_time = { version = "0.20.1", default-features = false }
bevy_math = { version = "0.20.1", default-features = false }
bevy_state = { version = "0.20.1", default-features = false }
